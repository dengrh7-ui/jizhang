# Render 部署蓝图（Blueprint）
# 在 Render 控制台选择 New → Blueprint，连接本仓库即可一键创建。
services:
  - type: web
    name: dexunlu
    runtime: node
    plan: free
    branch: claude/admiring-gates-6cmukl
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
