<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>德训录</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1>德训录</h1>
  <p class="subtitle">训练记录 · 运动日历 · 训练要点</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="log">记录</button>
  <button class="tab-btn" data-tab="calendar">日历</button>
  <button class="tab-btn" data-tab="programs">项目</button>
  <button class="tab-btn" data-tab="tips">要点</button>
  <button class="tab-btn" data-tab="stats">统计</button>
  <button class="tab-btn" data-tab="coach">助手</button>
</nav>

<main>
  <!-- ========== 训练记录 ========== -->
  <section id="tab-log" class="tab-panel active">
    <div class="card">
      <h2>开始新的训练</h2>
      <div class="form-row">
        <label>训练项目</label>
        <select id="session-program"></select>
      </div>
      <div class="form-row">
        <label>训练日期</label>
        <input type="date" id="session-date">
      </div>
      <div class="row-actions">
        <button class="btn primary" id="start-session">创建训练</button>
        <button class="btn" id="copy-last-session">复制上次同项目训练</button>
      </div>
    </div>

    <div id="sessions-list"></div>
  </section>

  <!-- ========== 运动日历 ========== -->
  <section id="tab-calendar" class="tab-panel">
    <div class="card">
      <div class="cal-header">
        <button class="btn icon" id="cal-prev" aria-label="上个月">‹</button>
        <h2 id="cal-title"></h2>
        <button class="btn icon" id="cal-next" aria-label="下个月">›</button>
      </div>
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div id="cal-day-detail"></div>
  </section>

  <!-- ========== 训练项目 ========== -->
  <section id="tab-programs" class="tab-panel">
    <div class="card">
      <h2>自定义训练项目</h2>
      <p class="hint">创建你自己的训练分类，例如：胸部训练、腿部训练、肩部训练、功能性训练、手臂训练。</p>
      <div class="form-row">
        <label>项目名称</label>
        <input type="text" id="program-name" placeholder="例如：背部训练">
      </div>
      <div class="form-row">
        <label>包含动作（用逗号分隔，可选）</label>
        <input type="text" id="program-exercises" placeholder="例如：引体向上, 杠铃划船, 高位下拉">
      </div>
      <button class="btn primary" id="add-program">+ 添加项目</button>
    </div>

    <div id="programs-list"></div>
  </section>

  <!-- ========== 训练要点 ========== -->
  <section id="tab-tips" class="tab-panel">
    <div class="card">
      <h2>训练要点</h2>
      <p class="hint">记录训练组数建议、训练要点和关键技巧。</p>
      <div class="form-row">
        <label>标题</label>
        <input type="text" id="tip-title" placeholder="例如：卧推关键技巧">
      </div>
      <div class="form-row">
        <label>分类</label>
        <select id="tip-category">
          <option value="组数建议">训练组数建议</option>
          <option value="训练要点">训练要点</option>
          <option value="关键技巧">关键技巧</option>
        </select>
      </div>
      <div class="form-row">
        <label>内容</label>
        <textarea id="tip-content" rows="3" placeholder="写下你的要点..."></textarea>
      </div>
      <button class="btn primary" id="add-tip">+ 添加要点</button>
    </div>

    <div class="tip-filters">
      <button class="chip active" data-filter="全部">全部</button>
      <button class="chip" data-filter="组数建议">组数建议</button>
      <button class="chip" data-filter="训练要点">训练要点</button>
      <button class="chip" data-filter="关键技巧">关键技巧</button>
    </div>
    <div id="tips-list"></div>
  </section>

  <!-- ========== 数据统计 ========== -->
  <section id="tab-stats" class="tab-panel">
    <div class="card">
      <h2>训练概览</h2>
      <div class="stat-grid" id="stat-summary"></div>
    </div>

    <div class="card">
      <h2>每周训练容量</h2>
      <p class="hint">容量 = 重量 × 次数 累加（单位：kg），按周统计。</p>
      <div id="volume-chart"></div>
    </div>

    <div class="card">
      <h2>动作进步追踪</h2>
      <p class="hint">选择一个动作，查看历次最大重量与每组总容量的变化。</p>
      <div class="form-row">
        <label>选择动作</label>
        <select id="progress-exercise"></select>
      </div>
      <div id="progress-chart"></div>
    </div>

    <div class="card">
      <h2>数据备份</h2>
      <p class="hint">导出为 JSON 文件保存，或导入此前的备份。导入将覆盖当前所有数据。</p>
      <div class="row-actions">
        <button class="btn primary" id="export-data">导出备份</button>
        <button class="btn" id="import-data">导入备份</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>

  <!-- ========== AI 助手 ========== -->
  <section id="tab-coach" class="tab-panel">
    <div class="card">
      <h2>AI 教练</h2>
      <p class="hint">由 Claude 提供运动与营养建议。需先启动本地后端并配置 API Key（见 README）。</p>
      <div class="tip-filters">
        <button class="chip active" data-coach-mode="运动">运动建议</button>
        <button class="chip" data-coach-mode="营养">营养建议</button>
      </div>
      <label class="coach-context">
        <input type="checkbox" id="coach-use-data"> 结合我的近期训练记录
      </label>
      <div class="form-row">
        <textarea id="coach-input" rows="3" placeholder="例如：帮我安排一周的胸背训练分化，每次 60 分钟"></textarea>
      </div>
      <button class="btn primary" id="coach-send">发送</button>
    </div>
    <div id="coach-response"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
